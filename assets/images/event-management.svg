<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="bgPillar3" x1="0" y1="0" x2="600" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#191e2e"/>
    </linearGradient>
    <linearGradient id="eventGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0082c8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="20" fill="url(#bgPillar3)"/>
  <!-- Stage light beams -->
  <polygon points="120,40 240,260 80,260" fill="url(#eventGlow)"/>
  <polygon points="480,40 520,260 360,260" fill="url(#eventGlow)"/>
  <!-- Stage platform -->
  <path d="M140 260 L200 230 H400 L460 260 H500 L440 290 H160 L100 260 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <!-- Camera Aperture & Lens -->
  <circle cx="300" cy="150" r="55" fill="#0b0f19" stroke="#0082c8" stroke-width="4"/>
  <circle cx="300" cy="150" r="42" stroke="#64748b" stroke-width="2" stroke-dasharray="8 4"/>
  <circle cx="300" cy="150" r="24" fill="#38bdf8" fill-opacity="0.2" stroke="#ff5520" stroke-width="3"/>
  <circle cx="308" cy="142" r="6" fill="#ffffff"/>
  <!-- Badges -->
  <rect x="110" y="320" width="180" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="126" y="346" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700">EXPERIENTIAL STAGES &amp; POP</text>
  <rect x="310" y="320" width="180" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="322" y="346" fill="#ff5520" font-family="monospace" font-size="12" font-weight="700">PHOTO &amp; VIDEO DOCUMENTATION</text>
</svg>
