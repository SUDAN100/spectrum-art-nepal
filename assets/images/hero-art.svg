<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" fill="none">
  <defs>
    <radialGradient id="heroOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0082c8" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#02a8e8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="curveGrad1" x1="0" y1="0" x2="800" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#02a8e8"/>
      <stop offset="50%" stop-color="#0082c8"/>
      <stop offset="100%" stop-color="#ff5520"/>
    </linearGradient>
    <linearGradient id="silverGrad2" x1="0" y1="0" x2="800" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Glowing atmospheric circle -->
  <circle cx="400" cy="400" r="380" fill="url(#heroOrb)"/>

  <!-- Orbital Concentric Circles -->
  <circle cx="400" cy="400" r="340" stroke="#334155" stroke-width="1.2" stroke-dasharray="8 8" opacity="0.4"/>
  <circle cx="400" cy="400" r="260" stroke="#02a8e8" stroke-width="1.5" stroke-dasharray="12 12" opacity="0.35"/>
  <circle cx="400" cy="400" r="180" stroke="#64748b" stroke-width="1" opacity="0.3"/>

  <!-- Dynamic Infinity Ribbon Contour -->
  <path d="M220 300 C 130 300 70 360 70 420 C 70 490 140 550 240 550 C 330 550 380 470 400 420 C 420 370 470 290 560 290 C 660 290 730 350 730 420 C 730 490 670 550 580 550 C 490 550 430 470 400 420 C 370 370 310 300 220 300 Z" 
        stroke="url(#curveGrad1)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9"/>

  <!-- Secondary Inner Highlight Path -->
  <path d="M400 420 C 430 470 490 540 580 540 C 660 540 720 480 720 420 C 720 360 660 300 570 300" 
        stroke="url(#silverGrad2)" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Radial compass lines -->
  <line x1="400" y1="20" x2="400" y2="780" stroke="#475569" stroke-width="1" stroke-dasharray="6 6" opacity="0.25"/>
  <line x1="20" y1="400" x2="780" y2="400" stroke="#475569" stroke-width="1" stroke-dasharray="6 6" opacity="0.25"/>

  <!-- Strategic Coordinate Crosshairs & Badges -->
  <circle cx="400" cy="420" r="8" fill="#ff5520"/>
  <circle cx="400" cy="420" r="24" stroke="#ff5520" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="240" cy="550" r="5" fill="#02a8e8"/>
  <circle cx="560" cy="290" r="5" fill="#38bdf8"/>
  
  <rect x="290" y="710" width="220" height="38" rx="19" fill="#0b0f19" stroke="#0082c8" stroke-width="1.5"/>
  <text x="315" y="734" fill="#38bdf8" font-family="'Space Mono', monospace" font-size="12" font-weight="700" letter-spacing="1.5">ODYSSEY OF CREATIVITY</text>
</svg>
