<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" height="100%">
  <defs>
    <linearGradient id="burgundyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9E3E3D"/>
      <stop offset="50%" stop-color="#7B302F"/>
      <stop offset="100%" stop-color="#551F1E"/>
    </linearGradient>
    <linearGradient id="beigeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAE1D7"/>
      <stop offset="100%" stop-color="#D9C8B8"/>
    </linearGradient>
  </defs>

  <!-- Emblem Mark: Prismatic artistic spectrum motif with Nepali cultural flair -->
  <g transform="translate(20, 16)">
    <!-- Outer delicate ring -->
    <circle cx="64" cy="64" r="62" fill="none" stroke="#D9C8B8" stroke-width="1.5" stroke-dasharray="3,3" />
    <circle cx="64" cy="64" r="56" fill="#F8F6F2" stroke="#7B302F" stroke-width="2" />
    
    <!-- Dynamic artistic spectrum fan / brush sweeps -->
    <path d="M 64 64 L 64 16 A 48 48 0 0 1 106 41 Z" fill="#7B302F" opacity="0.95" />
    <path d="M 64 64 L 106 41 A 48 48 0 0 1 112 64 Z" fill="#9E3E3D" opacity="0.9" />
    <path d="M 64 64 L 112 64 A 48 48 0 0 1 98 102 Z" fill="#B85B59" opacity="0.85" />
    <path d="M 64 64 L 98 102 A 48 48 0 0 1 64 112 Z" fill="#D9C8B8" opacity="0.9" />
    <path d="M 64 64 L 64 112 A 48 48 0 0 1 22 87 Z" fill="#B8A38F" opacity="0.85" />
    <path d="M 64 64 L 22 87 A 48 48 0 0 1 16 64 Z" fill="#602423" opacity="0.9" />
    <path d="M 64 64 L 16 64 A 48 48 0 0 1 30 26 Z" fill="#451A19" opacity="0.95" />
    <path d="M 64 64 L 30 26 A 48 48 0 0 1 64 16 Z" fill="#7B302F" opacity="0.9" />

    <!-- Center core palette / canvas emblem -->
    <circle cx="64" cy="64" r="22" fill="#FFFFFF" stroke="#7B302F" stroke-width="2" />
    <circle cx="64" cy="64" r="16" fill="url(#burgundyGrad)" />
    <!-- Stylized artist palette touch / golden dot -->
    <circle cx="64" cy="64" r="6" fill="#D9C8B8" />
  </g>

  <!-- Typography: Editorial, classical serif + clean architectural grotesque -->
  <g transform="translate(170, 0)">
    <!-- SPECTRUM -->
    <text x="0" y="74" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-size="44" font-weight="700" letter-spacing="4" fill="#7B302F">
      SPECTRUM
    </text>
    
    <!-- ART ASSOCIATION -->
    <text x="2" y="108" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600" letter-spacing="7" fill="#292929">
      ART ASSOCIATION
    </text>

    <!-- Subtitle / Heritage -->
    <text x="3" y="132" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500" letter-spacing="2" fill="#7B302F" opacity="0.85">
      ESTD. 2060 B.S. • KATHMANDU, NEPAL
    </text>

    <!-- Refined Accent divider line -->
    <line x1="2" y1="116" x2="280" y2="116" stroke="#D9C8B8" stroke-width="1.5" />
  </g>
</svg>
